name: Build APEX AI APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0-apex
          name: "APEX AI v1.2.0 (Artemis Autonomous Edition)"
          body: |
            ### 🚀 APEX AI — Autonomous Mobile Assistant (Artemis Integrated)
            
            **What's new in this build:**
            - 🌟 **Complete Rebranding to APEX AI:** Full standalone identity, `com.apexai` architecture, and services.
            - ⚡ **Artemis 3-Tier Multi-Window Penetration:** Detects and interacts with dialogs, floating overlays, system alerts, and IME keyboards across layers.
            - 🎯 **Chained Click Sequence (`click_sequence`):** Atomic 50ms sequential tapping to conquer transient UI, auto-dismissing toast notifications, and short-timeout menus.
            - 📐 **Universal Coordinate Normalization:** Full 0-1000 coordinate space support alongside raw pixel coordinates, auto-scaling seamlessly across all device screens and foldables.
            - 📸 **Atomic Snapshot (`screenshot_and_read`):** Simultaneous hardware screenshot capture and UI accessibility layout tree parsing at the exact same clock tick.
            - 🧠 **Artemis Flash Cognitive Protocol:** Strict Observation -> Planning -> Action execution cycle with anti-stagnation loop protection and Time-Sensitive UI awareness.
            - 🦾 **Universal AI Engine & Arc Reactor HUD:** OmniRoute server proxy, Custom OpenAI endpoint, Flashlight, Volume, Media control, and zero-latency continuous voice.
            
            Download `app-debug.apk` below directly to your phone!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

