name: Build APEX AI APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.2.0-apex
          name: "APEX AI APK v0.2.0"
          body: |
            ### ⚡ APEX AI — Autonomous AI Assistant for Android (v0.2.0)
            
            **What's new in this build:**
            - 🚀 **Personalized Rebrand to APEX AI:** Elite autonomous assistant identity, custom cyber apex icon, and sleek visual theme.
            - 🛡️ **Android 13/14+ Restricted Settings Helper:** Built-in guidance and one-tap direct App Info launcher to easily bypass sideload accessibility locks.
            - ⚡ **Ultra-Fast Screen Control:** Async gesture completion (`CompletableDeferred` + `GestureResultCallback`) and composite `tap_and_read` single-turn actions.
            - 🎙️ **Zero-Latency Voice Engine:** 120ms turnaround latency between TTS completion and recognition activation.
            - 🦾 **Universal AI Core:** Direct OmniRoute proxy, Gemini, Claude, and OpenAI support.
            
            Download `app-debug.apk` below directly to your phone!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
