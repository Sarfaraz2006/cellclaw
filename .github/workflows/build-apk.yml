name: Build APEX AI APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.3.1-apex
          name: "APEX AI APK v0.3.1"
          body: |
            ### ⚡ APEX AI — Autonomous AI Assistant for Android (v0.3.1)
            
            **What's new in this build:**
            - 🚀 **Actual 2026 Frontier Models:** Directly routes to live 2026 engines: Claude Sonnet 4.6 (default), Claude Sonnet 5.5, Claude Opus 5, Gemini 3.8 Flash High, Gemini 3.7 Flash, GPT-5.6, and DeepSeek-R1.
            - 🔄 **Intelligent Zero-Crash Auto-Fallback:** Resilient fallback loop recovers seamlessly across healthy models when encountering 400, 402 (insufficient credits), 404 (deprecated model), 429 (rate limits), or 504 (timeouts).
            - 🌐 **Automatic URL Normalization:** Base URLs without `http://` or `/v1` are auto-sanitized on save and request execution, permanently fixing URL scheme crashes.
            - 🍏 **Apple-Grade Fluid Compose UI & Haptics:** Cosmic dark theme (`#0B0E17`), asymmetric chat bubbles (4dp / 20dp), spring-based smooth animated transitions, and subtle tactile haptic feedback.
            - 🔋 **Deep OEM Battery Survival:** `ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS` whitelist integration in Setup & Settings to keep APEX AI alive 24/7 on ColorOS, OxygenOS, and MIUI.
            - 🛡️ **Android 13/14+ Restricted Settings Helper:** Built-in guidance and one-tap direct App Info launcher to easily bypass sideload accessibility locks.
            - ⚡ **Ultra-Fast Screen Control:** Async gesture completion (`CompletableDeferred` + `GestureResultCallback`) and composite `tap_and_read` single-turn actions.
            
            Download `app-debug.apk` below directly to your phone!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
