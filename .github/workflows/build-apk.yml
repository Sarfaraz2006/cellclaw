name: Build APEX AI APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.1-apex
          name: "APEX AI APK v1.3.1"
          body: |
            ### ⚡ APEX AI — Autonomous AI Assistant for Android (v1.3.1)
            
            **What's new in this build:**
            - 💬 **Rock-Solid ChatGPT-Style Conversational UI:** Full direct launch into chat with seamless navigation drawer, top bar model selector, and interactive ColorOS restricted settings fixer restored from proven v0.3.2 baseline.
            - 🎯 **Google Artemis Screen Control Integration:** 
              - 3-tier multi-window penetration to inspect dialogs, popups, and IME overlays.
              - Normalized 0-1000 coordinate mapping with center point clipping.
              - Atomic snapshot capturing accessibility tree and hardware screenshot simultaneously (`screen.read` with `include_screenshot=true`).
              - Chained `click_sequence` with 50ms rapid burst delay to capture transient and auto-dismissing UI menus.
            - ⚡ **Complete High-Fidelity Rebranding:** Clean "APEX AI" presentation across app launcher, notification channels, top bar, drawer, and all user-facing dialogs.
            - 🚀 **Default Native Gemini 3.8 Flash:** Out-of-the-box routing to `gemini-3.8-flash-high` via high-speed OmniRoute (`http://91.99.52.110:20128/v1`) with zero-config token authentication.
            - 🔄 **Intelligent Zero-Crash Auto-Fallback:** Resilient fallback loop across healthy frontier models (Gemini 3.8 Flash, Claude Sonnet 4.6, GPT-5.2) without runtime crashes.
            - 🔋 **Deep OEM Battery Persistence:** 24/7 background survival on ColorOS, OxygenOS, and HyperOS.
            
            Download `app-debug.apk` below directly to your phone!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
