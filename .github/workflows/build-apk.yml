name: Build APEX AI APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/master') || startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v0.3.2-apex
          name: "APEX AI APK v0.3.2"
          body: |
            ### ⚡ APEX AI — Autonomous AI Assistant for Android (v0.3.2)
            
            **What's new in this build:**
            - 💬 **Direct Chat Launch (ChatGPT-Style UI):** App now launches directly into the main conversational interface without forcing a blocking setup wizard. Seamless navigation drawer & top bar model selector.
            - 🚀 **Default Native Gemini 3.8 Flash:** Out-of-the-box routing to `gemini-3.8-flash-high` via high-speed OmniRoute (`http://91.99.52.110:20128/v1`) with zero-config token authentication.
            - 🛡️ **Android 13/14+ Restricted Setting Fixer:** Interactive in-app guide resolving the ColorOS / Android 13+ "Uninstall for all users" issue by guiding users through triggering the OS security dialog before enabling restricted settings.
            - 🔄 **Intelligent Zero-Crash Auto-Fallback:** Resilient fallback loop recovers seamlessly across healthy models when encountering 400, 402, 404, 429, or 504.
            - 🌐 **Automatic URL Normalization:** Base URLs without `http://` or `/v1` are auto-sanitized on save and request execution.
            - 🔋 **Deep OEM Battery Persistence:** 24/7 background survival on ColorOS, OxygenOS, and HyperOS.
            
            Download `app-debug.apk` below directly to your phone!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
